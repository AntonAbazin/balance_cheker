<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="container">
      <header class="page-header">
        <h1>Balance Checker</h1>
        <div class="header-actions">
          <button type="button" id="check-all-btn" class="btn btn-secondary">
            <svg class="icon-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5A7 7 0 1 1 3 10" stroke-linecap="round"/><path d="M4 1v4h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            
          </button>
          <button type="button" id="open-add-modal" class="btn btn-primary">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
            Добавить
          </button>
        </div>
      </header>

      <div id="usdt-total" class="total-card" hidden></div>

      <div id="wallets-list" class="wallets-list"></div>

      <div id="empty-hint" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="7" width="20" height="14" rx="3"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M12 12v4M10 14h4" stroke-linecap="round"/></svg>
        <span>Нет добавленных кошельков</span>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Добавить кошелёк</h2>
        <button type="button" id="close-add-modal" class="modal-close" aria-label="Закрыть">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l12 12M16 4L4 16" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="add-form">
        <label>
          Метка <span class="label-hint">(необязательно)</span>
          <input type="text" name="label" placeholder="Например: холодный кошелёк">
        </label>

        <label>
          Блокчейн
          <select name="blockchain" id="blockchain-select" required></select>
        </label>

        <label>
          Адрес кошелька
          <input type="text" name="address" class="mono" required placeholder="0x... или T...">
        </label>

        <div id="add-error" class="error"></div>

        <div class="modal-actions">
          <button type="button" id="cancel-add" class="btn btn-ghost">Отмена</button>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
